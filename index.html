<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rastrojero</title>
  </head>
  <body>
  <header class="brand">
    <span class="brand-title">Rastrojero</span>
    <a class="brand-link" href="https://github.com/PabloMesquida/off-road" target="_blank" rel="noopener noreferrer" aria-label="Ver el código en GitHub">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
      GitHub
    </a>
  </header>
  <div class="drive-menu" role="menu" aria-label="Driving controls">
    <h4>Drive Controls</h4>
    <ul>
      <li><span class="key">W / ↑</span><span class="action">Accelerate</span></li>
      <li><span class="key">S / ↓</span><span class="action">Reverse</span></li>
      <li><span class="key">A / ←</span><span class="action">Steer Left</span></li>
      <li><span class="key">D / →</span><span class="action">Steer Right</span></li>
      <li><span class="key">Space</span><span class="action">Brake</span></li>
      <li><span class="key">B</span><span class="action">Hazards</span></li>
      <li><span class="key">L</span><span class="action">Lights</span></li>
    </ul>
    <h4>Edit Controls</h4>
    <ul>
      <li><span class="key">X</span><span class="action">Delete</span></li>
      <li><span class="key">Wheel</span><span class="action">Rotate</span></li>
    </ul>
  </div>
    <button class="recordBtn" id="recordBtn">🎬 Grabar</button>
    <canvas class="game"></canvas>
    <script type="module">
      const recordBtn = document.getElementById('recordBtn');
      const isLocal =
        location.hostname === 'localhost' ||
        location.hostname === '127.0.0.1';

      if (!isLocal) {
        recordBtn.style.display = 'none';
      }
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
