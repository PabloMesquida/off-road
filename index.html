<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OFF ROAD</title>

  <body>

    <canvas class="game"></canvas>

        recordBtn.style.display = 'none';
      }
