<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OFF ROAD</title>
  </head>
  <body>
  <div class="drive-menu" role="menu" aria-label="Driving controls">
    <h4>Drive Controls</h4>
    <ul>
      <li><span class="key">W / ↑</span><span class="action">Accelerate</span></li>
      <li><span class="key">S / ↓</span><span class="action">Reverse</span></li>
      <li><span class="key">A / ←</span><span class="action">Steer Left</span></li>
      <li><span class="key">D / →</span><span class="action">Steer Right</span></li>
      <li><span class="key">Space</span><span class="action">Brake</span></li>
      <li><span class="key">B</span><span class="action">Hazards</span></li>
      <li><span class="key">L</span><span class="action">Lights</span></li>
    </ul>
    <h4>Edit Controls</h4>
    <ul>
      <li><span class="key">R</span><span class="action">Rotate</span></li>
      <li><span class="key">T</span><span class="action">Translate</span></li>
      <li><span class="key">X</span><span class="action">Delete</span></li>
    </ul>
  </div>
    <button class="recordBtn" id="recordBtn">🎬 Grabar</button>
    <canvas class="game"></canvas>
    <script type="module">
      const recordBtn = document.getElementById('recordBtn');
      const isLocal =
        location.hostname === 'localhost' ||
        location.hostname === '127.0.0.1';

      if (!isLocal) {
        recordBtn.style.display = 'none';
      }
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
